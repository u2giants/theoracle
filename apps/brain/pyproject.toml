[project]
name = "brain"
version = "0.1.0"
description = "Oracle Company Map brain service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
  "falkordb",
  "pypdfium2",
  "pillow",
  "igraph",
  "leidenalg",
  "tiktoken",
  "numpy",
  "webvtt-py",
  "python-multipart",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
