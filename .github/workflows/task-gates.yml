name: task gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: task-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Oracle
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out accepted task-gate engine
        uses: actions/checkout@v4
        with:
          repository: popcre/ai-devops
          ref: 51905b73c7d2e65d111205ab0552f25bc0183635
          path: .task-gates-toolkit
          persist-credentials: false

      - name: Add task-gate commands to the runner path
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.task-gates-toolkit/bin" >> "$GITHUB_PATH"

      - name: Verify installed command and Oracle policy
        shell: bash
        run: |
          ai-task-gates version
          ai-repo-policy | grep -q '"repository":"u2giants/theoracle"'
          scripts/test-task-gates.sh
