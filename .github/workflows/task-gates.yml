name: task gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: task-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Oracle
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out accepted task-gate engine
        uses: actions/checkout@v4
        with:
          repository: popcre/ai-devops
          ref: 4d83f9a5dc400f87408663eddac872b9074c18ed
          path: .task-gates-toolkit
          persist-credentials: false

      - name: Install task-gate commands on the runner path
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -s "$GITHUB_WORKSPACE/.task-gates-toolkit/bin/ai-task-gates" "$HOME/.local/bin/ai-task-gates"
          ln -s "$GITHUB_WORKSPACE/.task-gates-toolkit/bin/ai-repo-policy" "$HOME/.local/bin/ai-repo-policy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installed command and Oracle policy
        shell: bash
        run: |
          ai-task-gates version
          ai-repo-policy | grep -q '"repository":"u2giants/theoracle"'
          scripts/test-task-gates.sh
