name: Oracle native documentary image
on:
  pull_request:
    branches: [main]
    paths: ['services/oracle-brain/**', 'dev/oracle2/hosting/**', '.dockerignore', '.github/workflows/oracle-native-image.yml']
  push:
    branches: [main]
    paths: ['services/oracle-brain/**', 'dev/oracle2/hosting/**', '.dockerignore', '.github/workflows/oracle-native-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-native-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build documentary profile with import and distribution gates
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/oracle2/hosting/Dockerfile
          push: false
          tags: oracle-native:verified
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=oracle-native-documentary
          cache-to: type=gha,scope=oracle-native-documentary,mode=max
  publish-image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable documentary artifact; deployment is separately gated
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/oracle2/hosting/Dockerfile
          push: true
          tags: ghcr.io/u2giants/theoracle-native:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=oracle-native-documentary
      - name: Record exact artifact
        run: |
          printf '%s\n' '${{ steps.image.outputs.digest }}' > native-image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-native-documentary-${{ github.sha }}
          path: native-image-digest.txt
