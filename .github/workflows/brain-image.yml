name: Brain image

# Step 14 of plan_oracle_company_map.md: every apps/brain change on main
# publishes ghcr.io/u2giants/theoracle-brain:<sha> and :latest. Coolify
# deploys the tag named in its BRAIN_IMAGE_TAG variable (deployment is a
# separate, reviewed action; this workflow only builds and publishes).

on:
  pull_request:
    paths:
      - 'apps/brain/**'
      - '.github/workflows/brain-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/brain/**'
      - '.github/workflows/brain-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: brain image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on main, publish) the brain image
        uses: docker/build-push-action@v6
        with:
          context: apps/brain
          file: apps/brain/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/u2giants/theoracle-brain:${{ github.sha }}
            ghcr.io/u2giants/theoracle-brain:latest
          labels: org.opencontainers.image.source=https://github.com/u2giants/theoracle
          cache-from: type=gha,scope=theoracle-brain
          cache-to: type=gha,scope=theoracle-brain,mode=max
