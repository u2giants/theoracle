name: Oracle 2 contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: oracle2-real-stores-edge-dev3
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trusted-context:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse untrusted events before allocating a private runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          case "$EVENT_NAME" in
            push) test "$EVENT_REF" = refs/heads/main ;;
            pull_request) test -n "$HEAD_REPOSITORY" && test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ;;
            *) echo 'Untrusted Oracle workflow event.' >&2; exit 1 ;;
          esac
  oracle2-offline:
    name: Oracle offline suites
    needs: trusted-context
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, edge-dev3]
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: oracle2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ORACLE2_SYNTHETIC_POSTGRES_CONTAINER: oracle2-ci-${{ github.run_id }}-${{ github.run_attempt }}-postgres-1
      ORACLE2_POSTGRES_PORT: '57632'
      ORACLE2_CANDIDATE_PORT: '57679'
      ORACLE2_CONFIRMED_PORT: '57680'
      ORACLE2_OBJECT_PORT: '57666'
      ORACLE2_OPERATING_TEST_GRAPH_URL: redis://:oracle2_candidate_local_only@127.0.0.1:57679
      ORACLE2_TEST_ADMIN_URL: postgresql://oracle2_admin:oracle2_local_admin_only@127.0.0.1:57632/oracle2
      ORACLE2_TEST_CANDIDATE_URL: redis://:oracle2_candidate_local_only@127.0.0.1:57679
      ORACLE2_TEST_CONFIRMED_URL: redis://:oracle2_confirmed_local_only@127.0.0.1:57680
      ORACLE2_TEST_BLOB_ENDPOINT: http://127.0.0.1:57666
      ORACLE2_TEST_FALKORDB_URL: redis://:oracle2_candidate_local_only@127.0.0.1:57679
      GRAPHITI_TELEMETRY_ENABLED: 'false'
      ORACLE2_TELEMETRY_MODE: 'off'
    steps:
      - name: Select private metadata path from native runner context
        run: |
          test -n "$RUNNER_TEMP"
          test -n "$GITHUB_RUN_ID"
          test -n "$GITHUB_RUN_ATTEMPT"
          printf 'ORACLE_TARGET_PROFILE_PATH=%s/oracle-target-%s-%s/targets.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Full-history checkout for frozen S01 corpus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate S01 corpus and regression checks
        run: |
          python3 scripts/oracle2/validate_manifest.py --synthetic
          python3 -m unittest discover -s scripts/oracle2 -p 'test_*.py'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare private pinned target metadata
        env:
          ORACLE_TARGET_PROFILE_JSON: ${{ secrets.ORACLE_TARGET_PROFILE_JSON }}
        run: node dev/oracle2/prepare-ci-target-profile.mjs
      - name: Verify private metadata custody and refusal paths
        run: node --test dev/oracle2/private-target-profile.test.mjs dev/oracle2/prepare-ci-target-profile.test.mjs
      - name: Install TypeScript contracts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify TypeScript contract fixtures
        run: pnpm --filter @oracle/brain-contracts verify:parity
      - name: Typecheck workers and Oracle 2 Trigger configs
        run: pnpm --filter @oracle/workers typecheck
      - name: Verify isolated native Trigger project configuration
        run: pnpm --filter @oracle/workers exec tsx --test oracle2-native-config.test.ts oracle2-native-v2-config.test.ts oracle2-native-v2-task.test.ts
      - name: Typecheck corrected pilot web
        run: pnpm --filter @oracle/web typecheck
      - name: Verify new native browser authority and result binding
        run: pnpm --filter @oracle/web exec tsx --test lib/native-trigger.test.ts lib/native-trigger-v2.test.ts
      - name: Verify replacement journey contract and fixture store
        run: pnpm --filter @oracle/web exec tsx --test lib/replacement-contract.test.ts lib/replacement-fixture-auth.test.ts lib/replacement-fixture-route.test.ts
      - name: Verify Oracle 2 worker script bundle paths
        run: node scripts/oracle2/verify_worker_bundle.mjs
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
      - name: Install locked CPU dependency bundle
        run: uv sync --project services/oracle-brain --frozen --extra test --extra process-analysis
      - name: Verify workflow trust and required-result boundaries
        run: services/oracle-brain/.venv/bin/python -m unittest discover -s dev/oracle2 -p 'test_ci_trust_boundary.py'
      - name: S02 model evaluation harness offline tests
        env:
          ORACLE2_REQUIRE_MODEL_TESTS: '1'
        run: services/oracle-brain/.venv/bin/python -m unittest discover -s scripts/oracle2 -p 'test_evaluate_models.py'
      - name: Verify exported contracts
        run: |
          services/oracle-brain/.venv/bin/python scripts/oracle2/export_contracts.py
          git diff --exit-code -- packages/brain-contracts/schema
          uv export --project services/oracle-brain --frozen --format requirements-txt --no-dev --no-emit-project --emit-index-url --output-file apps/workers/oracle2-requirements.txt
          git diff --exit-code -- apps/workers/oracle2-requirements.txt
      - name: Verify corresponding-source archive and build exact offer
        run: |
          services/oracle-brain/.venv/bin/python -m pytest -q scripts/licensing/test_source_offer.py
          node scripts/licensing/build_source_offer.mjs
      - name: Start isolated real stores
        run: docker compose -f dev/oracle2/compose.yaml up -d --wait
      - name: Authenticate owned synthetic PostgreSQL with TLS and SCRAM
        run: |
          umask 077
          postgres=$(docker compose -f dev/oracle2/compose.yaml ps -q postgres)
          services/oracle-brain/.venv/bin/python dev/oracle2/test_tls_bootstrap.py \
            --container "$postgres" --directory "$RUNNER_TEMP/oracle2-tls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Prove an owned exact-namespace native read-only graph
        run: |
          umask 077
          candidate=$(docker compose -f dev/oracle2/compose.yaml ps -q falkor-candidate)
          services/oracle-brain/.venv/bin/python dev/oracle2/test_readonly_graph_fixture.py \
            --container "$candidate" --directory "$RUNNER_TEMP/oracle2-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Verify synthetic bootstrap ordering and owner refusals
        run: services/oracle-brain/.venv/bin/python -m pytest -q scripts/oracle2/init_local_stores_test.py scripts/oracle2/legacy_database_fixture_test.py
      - name: Bootstrap isolated synthetic ledger and checkpoint tables
        run: services/oracle-brain/.venv/bin/python scripts/oracle2/init_local_stores.py
      - name: New operating-model documentary and event contracts
        run: services/oracle-brain/.venv/bin/python scripts/oracle2/verify_workflow_integrity.py --stage W10 --mode synthetic
      - name: S02 offline contract and storage gate
        run: python3 scripts/oracle2/verify_phase.py S02 --mode offline
      - name: S03 pilot journey offline gate
        run: python3 scripts/oracle2/verify_phase.py S03 --mode offline
      - name: Install browser for synthetic connected-document proof
        run: pnpm --filter @oracle/web exec playwright install chromium
      - name: Prove browser through SDK transport and real FalkorDB
        run: services/oracle-brain/.venv/bin/python scripts/oracle2/verify_holistic_browser.py
      - name: Prove isolated native browser transport and authority refusals
        run: pnpm --filter @oracle/web exec tsx lib/__verify__/native-acceptance.ts
      - name: Validate analytical packet without admitting execution
        run: services/oracle-brain/.venv/bin/python -m pytest scripts/oracle2/test_validate_analytical_packet.py -q
      - name: Prove pilot PostgreSQL TLS trust and refusals
        run: pnpm --filter @oracle/web exec tsx ../../scripts/oracle2/verify_pilot_tls.ts
      - name: Prove invented operating model through current worker SDK and ledger
        env:
          PYTHONPATH: services/oracle-brain
        run: services/oracle-brain/.venv/bin/python scripts/oracle2/verify_workflow_browser.py
      - name: Prove pilot readiness-only browser coverage
        run: |
          services/oracle-brain/.venv/bin/python scripts/oracle2/verify_holistic_browser.py \
            --readiness-only --result out/oracle2/holistic-browser-readiness-result.json
      - name: Prove pilot graph-evidence answer path in the browser
        run: |
          services/oracle-brain/.venv/bin/python scripts/oracle2/verify_holistic_browser.py \
            --pilot-graph-evidence --result out/oracle2/pilot-graph-evidence-result.json
      - name: Pilot graph resource experiment
        run: services/oracle-brain/.venv/bin/python scripts/oracle2/resource_experiment.py --nodes 10000 --relations 100000 --output out/oracle2/resource-pilot.json
      - name: Ten-times graph stress experiment
        run: services/oracle-brain/.venv/bin/python scripts/oracle2/resource_experiment.py --nodes 100000 --relations 1000000 --output out/oracle2/resource-stress.json
      - name: Record graph peak memory before restart
        run: |
          confirmed=$(docker compose -f dev/oracle2/compose.yaml ps -q falkor-confirmed)
          docker exec "$confirmed" cat /sys/fs/cgroup/memory.peak > out/oracle2/confirmed-cgroup-memory-peak-bytes.txt
          docker exec "$confirmed" redis-cli -a oracle2_confirmed_local_only INFO memory \
            | grep -E '^(used_memory_peak|used_memory_rss):' > out/oracle2/confirmed-redis-memory.txt
          peak=$(cat out/oracle2/confirmed-cgroup-memory-peak-bytes.txt)
          test "$peak" -gt 0
          test "$peak" -le 2147483648
      - name: Restart confirmed graph and compare counts
        run: |
          started=$(date +%s)
          docker compose -f dev/oracle2/compose.yaml restart falkor-confirmed
          for attempt in {1..30}; do
            if docker compose -f dev/oracle2/compose.yaml exec -T falkor-confirmed redis-cli -a oracle2_confirmed_local_only ping | grep -q PONG; then break; fi
            sleep 2
          done
          ORACLE2_TEST_RESTORED_URL=redis://:oracle2_confirmed_local_only@127.0.0.1:57680 \
            services/oracle-brain/.venv/bin/python scripts/oracle2/restore_experiment.py \
              --pilot out/oracle2/resource-pilot.json \
              --stress out/oracle2/resource-stress.json \
              --kind restart --started-epoch "$started" \
              --output out/oracle2/restart-result.json
      - name: Restore graph snapshots in a fresh instance
        run: |
          started=$(date +%s)
          confirmed=$(docker compose -f dev/oracle2/compose.yaml ps -q falkor-confirmed)
          docker exec "$confirmed" redis-cli -a oracle2_confirmed_local_only SAVE
          mkdir -p $RUNNER_TEMP/oracle2-s02-restore-${GITHUB_RUN_ID}
          docker cp "$confirmed:/data/dump.rdb" $RUNNER_TEMP/oracle2-s02-restore-${GITHUB_RUN_ID}/dump.rdb
          docker run -d --name oracle2-ci-restored-${{ github.run_id }} \
            -e FALKORDB_ARGS='--dir /data --requirepass oracle2_confirmed_local_only --appendonly no' \
            -p 127.0.0.1:57681:6379 \
            -v $RUNNER_TEMP/oracle2-s02-restore-${GITHUB_RUN_ID}:/data \
            falkordb/falkordb:v4.20.7@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d
          for attempt in {1..30}; do
            if docker exec oracle2-ci-restored-${{ github.run_id }} redis-cli -a oracle2_confirmed_local_only ping | grep -q PONG; then break; fi
            sleep 2
          done
          ORACLE2_TEST_RESTORED_URL=redis://:oracle2_confirmed_local_only@127.0.0.1:57681 \
            services/oracle-brain/.venv/bin/python scripts/oracle2/restore_experiment.py \
              --pilot out/oracle2/resource-pilot.json \
              --stress out/oracle2/resource-stress.json \
              --kind new-instance --started-epoch "$started" \
              --output out/oracle2/restore-result.json
      - name: Record store resource usage
        if: always()
        run: |
          mkdir -p out/oracle2
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' > out/oracle2/docker-stats.txt
          cat out/oracle2/docker-stats.txt
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle2-s02-offline-result
          path: out/oracle2/
          if-no-files-found: error
      - name: Stop isolated stores
        if: always()
        run: |
          docker rm -f oracle2-ci-restored-${{ github.run_id }} 2>/dev/null || true
          docker compose -f dev/oracle2/compose.yaml down --volumes
      - name: Remove private target metadata
        if: always()
        run: node dev/oracle2/prepare-ci-target-profile.mjs --cleanup
  offline-result:
    name: oracle2-offline
    runs-on: ubuntu-latest
    needs: [trusted-context, oracle2-offline]
    if: always()
    steps:
      - name: Require trusted context and all offline suites
        env:
          TRUST_RESULT: ${{ needs['trusted-context'].result }}
          SUITE_RESULT: ${{ needs['oracle2-offline'].result }}
        run: |
          test "$TRUST_RESULT" = success && test "$SUITE_RESULT" = success
