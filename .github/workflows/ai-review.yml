name: ai-review

# Advisory AI review (popcre/ai-devops plan_skinny-review.md, stage G, #2075).
# One rotating reviewer, runs once per PR, never blocks merge. A REJECT or
# REVISE opens a `review-finding` issue for the automatic fixer.
# It runs on this repo's edge-dev3 runner, which holds the provider keys locally.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  scope:
    # Markdown-only pull requests skip the review (owner 2026-11-11).
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  review:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    uses: popcre/ai-devops/.github/workflows/ai-review.yml@main
    with:
      runner_labels: '["self-hosted", "edge-dev3"]'
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
      actions: write
