# Exact image/env bundles require independent action review. Public invented only.
# Raw Application parser is mandatory: no global env_file or implicit networks.
name: oracle-native-public-invented
x-runtime: &runtime
  image: ${ORACLE_HOSTING_IMAGE:?reviewed GHCR immutable digest required}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  init: true
  pids_limit: 128
  mem_limit: 1g
  cpus: 1
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
x-bootstrap: &bootstrap
  <<: *runtime
  user: '0:0'
  network_mode: none
  cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
  entrypoint: [python, -m, oracle_brain.hosting.bootstrap]
  restart: 'no'
services:
  gateway-files:
    <<: *bootstrap
    command: [gateway]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_GATEWAY_BUNDLE:?reviewed profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_GATEWAY_BUNDLE_SHA256:?external bundle hash required}
    volumes: [gateway-auth:/run/oracle-assets]
  executor-files:
    <<: *bootstrap
    command: [executor]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_EXECUTOR_BUNDLE:?reviewed profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_EXECUTOR_BUNDLE_SHA256:?external bundle hash required}
    volumes: [executor-auth:/run/oracle-assets]
  projector-files:
    <<: *bootstrap
    command: [synthetic-project]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_PROJECTOR_BUNDLE:?reviewed profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_PROJECTOR_BUNDLE_SHA256:?external bundle hash required}
    volumes: [projector-auth:/run/oracle-assets]
  ledger-files:
    <<: *bootstrap
    command: [ledger]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_LEDGER_BUNDLE:?reviewed profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_LEDGER_BUNDLE_SHA256:?external bundle hash required}
    volumes: [ledger-auth:/run/oracle-assets]
  ledger-init:
    <<: *bootstrap
    command: [ledger-init]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_SEED_BUNDLE:?reviewed fixed invented seed parameters required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_SEED_BUNDLE_SHA256:?external bundle hash required}
    volumes: [ledger-init:/run/oracle-assets]
  candidate-files:
    <<: *bootstrap
    command: [candidate]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_CANDIDATE_BUNDLE:?reviewed profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_CANDIDATE_BUNDLE_SHA256:?external bundle hash required}
    volumes: [candidate-auth:/run/oracle-assets]
  confirmed-files:
    <<: *bootstrap
    command: [confirmed]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_CONFIRMED_BUNDLE:?reviewed profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_CONFIRMED_BUNDLE_SHA256:?external bundle hash required}
    volumes: [confirmed-auth:/run/oracle-assets]
  spool-files:
    <<: *bootstrap
    command: [spool]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_SPOOL_BUNDLE:?reviewed empty profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_SPOOL_BUNDLE_SHA256:?external bundle hash required}
    volumes: [job-spool:/run/oracle-assets]
  blob-files:
    <<: *bootstrap
    command: [blobs]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_BLOB_BUNDLE:?reviewed empty profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_BLOB_BUNDLE_SHA256:?external bundle hash required}
    volumes: [executor-blobs:/run/oracle-assets]
  candidate-data-files:
    <<: *bootstrap
    command: [candidate-data]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_CANDIDATE_DATA_BUNDLE:?reviewed empty profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_CANDIDATE_DATA_BUNDLE_SHA256:?external bundle hash required}
    volumes: [candidate-data:/run/oracle-assets]
  confirmed-data-files:
    <<: *bootstrap
    command: [confirmed-data]
    environment:
      ORACLE_BOOTSTRAP_BUNDLE: ${ORACLE_CONFIRMED_DATA_BUNDLE:?reviewed empty profile bundle required}
      ORACLE_BOOTSTRAP_BUNDLE_SHA256: ${ORACLE_CONFIRMED_DATA_BUNDLE_SHA256:?external bundle hash required}
    volumes: [confirmed-data:/run/oracle-assets]
  ledger:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    networks: [ledger]
    environment: {POSTGRES_DB: oracle_synthetic, POSTGRES_USER: oracle_bootstrap, POSTGRES_PASSWORD_FILE: /run/oracle-auth/admin-password}
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/oracle-auth/server.crt, -c, ssl_key_file=/run/oracle-auth/server.key, -c, hba_file=/run/oracle-auth/pg_hba.conf]
    volumes: [ledger-data:/var/lib/postgresql/data, ledger-auth:/run/oracle-auth:ro, ledger-init:/docker-entrypoint-initdb.d:ro]
    depends_on: {ledger-files: {condition: service_completed_successfully}, ledger-init: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD-SHELL, 'test $$(psql -U oracle_bootstrap -d oracle_synthetic -Atc "SELECT count(*) FROM oracle2.synthetic_hosting_marker") = 1'], interval: 2s, timeout: 2s, retries: 30}
    mem_limit: 1g
    cpus: 1
  candidate:
    image: falkordb/falkordb:v4.20.7@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d
    networks: [candidate]
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment: {REDIS_ARGS: /run/oracle-auth/server.conf}
    volumes: [candidate-data:/var/lib/falkordb/data, candidate-auth:/run/oracle-auth:ro]
    depends_on: {candidate-files: {condition: service_completed_successfully}, candidate-data-files: {condition: service_completed_successfully}}
    mem_limit: 2g
    cpus: 1
  confirmed:
    image: falkordb/falkordb:v4.20.7@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d
    networks: [confirmed]
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment: {REDIS_ARGS: /run/oracle-auth/server.conf}
    volumes: [confirmed-data:/var/lib/falkordb/data, confirmed-auth:/run/oracle-auth:ro]
    depends_on: {confirmed-files: {condition: service_completed_successfully}, confirmed-data-files: {condition: service_completed_successfully}}
    mem_limit: 2g
    cpus: 1
  synthetic-project:
    <<: *runtime
    entrypoint: [python, -m, oracle_brain.hosting.synthetic_project]
    networks: [ledger, candidate]
    environment: {ORACLE_HOSTING_SETTINGS_SHA256: '${ORACLE_PROJECTOR_SETTINGS_SHA256:?reviewed settings hash required}'}
    volumes: [projector-auth:/run/oracle-auth:ro, executor-blobs:/run/oracle-blobs]
    depends_on: {projector-files: {condition: service_completed_successfully}, blob-files: {condition: service_completed_successfully}, ledger: {condition: service_healthy}, candidate: {condition: service_started}}
    restart: 'no'
  executor:
    <<: *runtime
    command: [executor]
    networks: [jobs, ledger, candidate]
    environment: {ORACLE_HOSTING_SETTINGS_SHA256: '${ORACLE_EXECUTOR_SETTINGS_SHA256:?reviewed settings hash required}'}
    volumes: [executor-auth:/run/oracle-auth:ro, executor-blobs:/run/oracle-blobs, job-spool:/run/oracle-jobs]
    depends_on: {synthetic-project: {condition: service_completed_successfully}, spool-files: {condition: service_completed_successfully}}
  gateway:
    <<: *runtime
    command: [gateway]
    networks: [ingress, jobs, ledger]
    environment: {ORACLE_HOSTING_SETTINGS_SHA256: '${ORACLE_GATEWAY_SETTINGS_SHA256:?reviewed settings hash required}'}
    expose: [8443]
    volumes: [gateway-auth:/run/oracle-auth:ro, job-spool:/run/oracle-jobs]
    depends_on: {gateway-files: {condition: service_completed_successfully}, executor: {condition: service_started}}
    labels:
      traefik.enable: 'true'
      traefik.docker.network: '${COOLIFY_RESOURCE_UUID:?platform-owned ingress network required}'
      traefik.tcp.routers.oracle-invented.rule: 'HostSNI(`${ORACLE_GATEWAY_HOST:?exact reviewed public gateway hostname required}`)'
      traefik.tcp.routers.oracle-invented.entrypoints: https
      traefik.tcp.routers.oracle-invented.tls.passthrough: 'true'
      traefik.tcp.routers.oracle-invented.service: oracle-invented
      traefik.tcp.services.oracle-invented.loadbalancer.server.port: '8443'
networks:
  ingress: {external: true, name: '${COOLIFY_RESOURCE_UUID:?platform-owned ingress network required}'}
  jobs: &isolated
    internal: true
    enable_ipv6: true
    driver_opts: {com.docker.network.bridge.gateway_mode_ipv4: isolated, com.docker.network.bridge.gateway_mode_ipv6: isolated}
  ledger:
    <<: *isolated
    ipam:
      config: [{subnet: 172.30.41.0/24}, {subnet: "fd42:6f72:6163:41::/64"}]
  candidate: *isolated
  confirmed: *isolated
volumes:
  gateway-auth: {}
  executor-auth: {}
  projector-auth: {}
  ledger-auth: {}
  ledger-init: {}
  candidate-auth: {}
  confirmed-auth: {}
  executor-blobs: {}
  job-spool: {}
  ledger-data: {}
  candidate-data: {}
  confirmed-data: {}
